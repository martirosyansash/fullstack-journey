<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Smart Todo App</title>
</head>
<body>
    <div class="app">
        <h1>✅ Smart Todo App</h1>
        <div class="input-group">
            <input id="taskInput" placeholder="Enter a new task...">
            <select id="priority">
                <option value="High">🔴 High</option>
                <option value="Medium">🟡 Medium</option>
                <option value="Low">🟢 Low</option>
            </select>
            <input type="date" id="deadline">
            <button id="addBtn">Add Task</button>
        </div>
        <div class="filter-group">
            <input id="search" placeholder="Search task...">
            <select id="filter">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
            </select>
            <select id="sort">
                <option value="">Sort</option>
                <option value="high">High First</option>
                <option value="low">Low First</option>
                <option value="date">Nearest Deadline</option>
            </select>
        </div>
        <ul id="taskList"></ul>
    
        <p id="stats"></p>
        <div class="actions">
            <button id="clearCompleted">Clear Completed</button>
            <button id="clearAll">Clear All</button>
        </div>
    </div>
    <div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Edit Task</h2>

        <input
            type="text"
            id="editTaskInput"
            placeholder="Task name..."
        >

        <select id="editPriority">
            <option value="High">🔴 High</option>
            <option value="Medium">🟡 Medium</option>
            <option value="Low">🟢 Low</option>
        </select>

        <input
            type="date"
            id="editDeadline"
        >

        <div class="modal-actions">
            <button id="cancelEdit">Cancel</button>
            <button id="saveEdit">Save</button>
        </div>

    </div>

</div>
    <script src="script.js"></script>
</body>
</html>
